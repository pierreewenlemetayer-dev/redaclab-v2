name: Vérifications navigateur Redac Lab v2
on:
  push:
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'data/**'
      - 'tests/**'
      - '.github/workflows/test-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navigateur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Chromium et Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Vérifier la présence du dictionnaire
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('data/lexique.json',encoding='utf-8'))
          assert len(d['entries']) >= 170000
          print('Dictionnaire :',len(d['entries']),'entrées')
          PY
      - name: Exécuter les tests
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/redac-server.log 2>&1 &
          node tests/verification.mjs
          node tests/visuel.mjs
      - name: Comparer avec la version validée de Lexi Lab
        run: |
          mkdir -p /tmp/lexilab-reference
          curl --fail --location --retry 3 -o /tmp/lexilab-reference/index.html 'https://raw.githubusercontent.com/pierreewenlemetayer-dev/lexilab/reference-validee-2026-10-28/index.html'
          mkdir -p /tmp/lexilab-reference/js /tmp/lexilab-reference/css /tmp/lexilab-reference/data
          curl --fail --location --retry 3 -o /tmp/lexilab-reference/js/app.js 'https://raw.githubusercontent.com/pierreewenlemetayer-dev/lexilab/reference-validee-2026-10-28/js/app.js'
          curl --fail --location --retry 3 -o /tmp/lexilab-reference/css/style.css 'https://raw.githubusercontent.com/pierreewenlemetayer-dev/lexilab/reference-validee-2026-10-28/css/style.css'
          cp data/lexique.json /tmp/lexilab-reference/data/lexique.json
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/redac-server.log 2>&1 &
          cd /tmp/lexilab-reference
          python3 -m http.server 8766 --bind 127.0.0.1 >/tmp/lexi-server.log 2>&1 &
          cd - >/dev/null
          node tests/comparaison-lexilab.mjs
      - name: Conserver les captures et les PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redaclab-v2-captures
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
